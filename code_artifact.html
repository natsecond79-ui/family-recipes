<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספר המתכונים הדיגיטלי המשפחתי</title>
    
    <!-- React & Tailwind CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-[#FDFBF7] font-sans text-gray-800 min-h-screen">

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect } = React;

        // Firebase Initialization
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-recipes-app';

        const CATEGORIES = [
          'עוגות ומאפים',
          'עיקריות',
          'תוספות',
          'סלטים',
          'מרקים',
          'קינוחים',
          'אחר'
        ];

        function App() {
          const [user, setUser] = useState(null);
          const [recipes, setRecipes] = useState([]);
          const [loading, setLoading] = useState(true);
          
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [selectedCategory, setSelectedCategory] = useState('הכל');
          const [searchQuery, setSearchQuery] = useState('');
          const [expandedRecipe, setExpandedRecipe] = useState(null);
          
          const [newRecipeTitle, setNewRecipeTitle] = useState('');
          const [newRecipeCategory, setNewRecipeCategory] = useState(CATEGORIES[0]);
          const [newRecipeImage, setNewRecipeImage] = useState(null);
          const [isSaving, setIsSaving] = useState(false);
          const [errorMsg, setErrorMsg] = useState('');

          // Lucide icons refresh
          useEffect(() => {
            if (window.lucide) {
              window.lucide.createIcons();
            }
          });

          // 1. Auth Setup
          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (err) {
                console.error("Auth error:", err);
              }
            };
            initAuth();
            
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
            });
            return () => unsubscribe();
          }, []);

          // 2. Fetch Data from Cloud
          useEffect(() => {
            if (!user) return;

            const recipesRef = collection(db, 'artifacts', appId, 'public', 'data', 'family_recipes');
            
            const unsubscribe = onSnapshot(recipesRef, (snapshot) => {
              const fetchedRecipes = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              fetchedRecipes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setRecipes(fetchedRecipes);
              setLoading(false);
            }, (error) => {
              console.error("Error fetching recipes:", error);
              setLoading(false);
            });

            return () => unsubscribe();
          }, [user]);

          // Handle Paste (Ctrl+V)
          useEffect(() => {
            const handlePaste = async (e) => {
              if (!isModalOpen) return;
              const items = e.clipboardData?.items;
              if (!items) return;

              for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                  const file = items[i].getAsFile();
                  if (file) {
                    e.preventDefault();
                    await processAndSetImage(file);
                  }
                  break;
                }
              }
            };

            window.addEventListener('paste', handlePaste);
            return () => window.removeEventListener('paste', handlePaste);
          }, [isModalOpen]);

          const processAndSetImage = (file) => {
            return new Promise((resolve, reject) => {
              if (!file.type.startsWith('image/')) {
                setErrorMsg('אנא העלו קובץ תמונה בלבד.');
                reject(new Error('Not an image'));
                return;
              }
              
              setErrorMsg('');
              const reader = new FileReader();
              
              reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                  const canvas = document.createElement('canvas');
                  const MAX_DIMENSION = 1200;
                  let width = img.width;
                  let height = img.height;

                  if (width > height) {
                    if (width > MAX_DIMENSION) {
                      height *= MAX_DIMENSION / width;
                      width = MAX_DIMENSION;
                    }
                  } else {
                    if (height > MAX_DIMENSION) {
                      width *= MAX_DIMENSION / height;
                      height = MAX_DIMENSION;
                    }
                  }

                  canvas.width = width;
                  canvas.height = height;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, width, height);
                  
                  const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                  setNewRecipeImage(dataUrl);
                  resolve(dataUrl);
                };
                img.src = event.target.result;
              };
              
              reader.onerror = () => {
                setErrorMsg('שגיאה בקריאת התמונה.');
                reject(new Error('File read error'));
              };
              
              reader.readAsDataURL(file);
            });
          };

          const handleFileUpload = async (e) => {
            const file = e.target.files[0];
            if (file) {
              await processAndSetImage(file);
            }
          };

          const saveRecipe = async () => {
            if (!newRecipeTitle.trim()) {
              setErrorMsg('יש להזין את שם המתכון');
              return;
            }
            if (!newRecipeImage) {
              setErrorMsg('יש לצרף תמונה של המתכון');
              return;
            }
            if (!user) {
              setErrorMsg('שגיאת התחברות. נסו לרענן את העמוד.');
              return;
            }

            setIsSaving(true);
            try {
              const recipesRef = collection(db, 'artifacts', appId, 'public', 'data', 'family_recipes');
              await addDoc(recipesRef, {
                title: newRecipeTitle,
                category: newRecipeCategory,
                image: newRecipeImage,
                createdAt: Date.now(),
                addedBy: user.uid
              });
              
              closeModal();
            } catch (err) {
              console.error("Error adding recipe:", err);
              setErrorMsg('אירעה שגיאה בשמירת המתכון.');
            } finally {
              setIsSaving(false);
            }
          };

          const handleDelete = async (id, e) => {
            e.stopPropagation();
            if (!window.confirm('האם אתם בטוחים שברצונכם למחוק את המתכון?')) return;
            
            try {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'family_recipes', id);
              await deleteDoc(docRef);
              if (expandedRecipe?.id === id) setExpandedRecipe(null);
            } catch (err) {
              console.error("Error deleting recipe:", err);
              alert('שגיאה במחיקת המתכון.');
            }
          };

          const closeModal = () => {
            setIsModalOpen(false);
            setNewRecipeTitle('');
            setNewRecipeCategory(CATEGORIES[0]);
            setNewRecipeImage(null);
            setErrorMsg('');
          };

          const filteredRecipes = recipes.filter(recipe => {
            const matchesCategory = selectedCategory === 'הכל' || recipe.category === selectedCategory;
            const matchesSearch = recipe.title.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
          });

          return (
            <div className="min-h-screen bg-[#FDFBF7] font-sans text-gray-800">
              
              {/* Header */}
              <header className="bg-gradient-to-b from-[#EAEFE9] to-[#FDFBF7] pt-12 pb-8 px-4 text-center">
                <div className="max-w-4xl mx-auto flex flex-col items-center justify-center space-y-4">
                  <div className="bg-white p-4 rounded-full shadow-sm text-[#738C7A]">
                    <i data-lucide="book-heart" className="w-12 h-12"></i>
                  </div>
                  <h1 className="text-4xl md:text-5xl font-serif text-[#4A5D4E] font-medium tracking-tight">
                    ספר המתכונים הדיגיטלי המשפחתי
                  </h1>
                  <p className="text-gray-500 text-lg max-w-xl mt-2">
                    האוסף שלנו למתכונים האהובים שעוברים מדור לדור. כל הטעמים, במקום אחד.
                  </p>
                  
                  <button 
                    onClick={() => setIsModalOpen(true)}
                    className="mt-6 flex items-center gap-2 bg-[#D18E84] hover:bg-[#C27E74] text-white px-6 py-3 rounded-full font-medium transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
                  >
                    <span>+</span>
                    <span>הוספת מתכון חדש</span>
                  </button>
                </div>
              </header>

              {/* Main Content */}
              <main className="max-w-7xl mx-auto px-4 py-8">
                
                <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-10 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                  <div className="relative w-full md:w-72">
                    <input 
                      type="text"
                      placeholder="חיפוש מתכון..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-4 pr-10 py-2 bg-gray-50 border border-gray-200 rounded-full focus:outline-none focus:ring-2 focus:ring-[#738C7A] focus:bg-white transition-all text-sm"
                    />
                  </div>

                  <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 hide-scrollbar">
                    {['הכל', ...CATEGORIES].map(category => (
                      <button
                        key={category}
                        onClick={() => setSelectedCategory(category)}
                        className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${
                          selectedCategory === category 
                            ? 'bg-[#738C7A] text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        {category}
                      </button>
                    ))}
                  </div>
                </div>

                {loading ? (
                  <div className="flex justify-center items-center py-20">
                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-[#738C7A]"></div>
                  </div>
                ) : filteredRecipes.length === 0 ? (
                  <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-gray-300">
                    <h3 className="text-xl text-gray-600 font-medium">לא נמצאו מתכונים</h3>
                    <p className="text-gray-400 mt-2">
                      {searchQuery || selectedCategory !== 'הכל' 
                        ? 'נסו לשנות את מילות החיפוש או הקטגוריה.' 
                        : 'עדיין אין כאן מתכונים. לחצו על כפתור ההוספה כדי להתחיל!'}
                    </p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    {filteredRecipes.map((recipe) => (
                      <div 
                        key={recipe.id}
                        onClick={() => setExpandedRecipe(recipe)}
                        className="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer border border-gray-100 group flex flex-col h-full transform hover:-translate-y-1"
                      >
                        <div className="relative h-56 w-full overflow-hidden bg-gray-100">
                          <img 
                            src={recipe.image} 
                            alt={recipe.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                            loading="lazy"
                          />
                          <div className="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-[#738C7A] shadow-sm">
                            {recipe.category}
                          </div>
                          <button 
                            onClick={(e) => handleDelete(recipe.id, e)}
                            className="absolute top-3 left-3 bg-white/90 hover:bg-red-50 text-red-500 p-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity shadow-sm"
                            title="מחק מתכון"
                          >
                            🗑️
                          </button>
                        </div>
                        <div className="p-5 flex-grow flex flex-col justify-between">
                          <h3 className="text-lg font-bold text-gray-800 line-clamp-2 leading-tight">{recipe.title}</h3>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </main>

              {/* Modal for Expanded Recipe */}
              {expandedRecipe && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={() => setExpandedRecipe(null)}>
                  <div className="bg-[#FDFBF7] rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col md:flex-row shadow-2xl relative" onClick={e => e.stopPropagation()}>
                    <button onClick={() => setExpandedRecipe(null)} className="absolute top-4 left-4 z-10 bg-white/80 hover:bg-white text-gray-600 p-2 rounded-full shadow-sm">✕</button>
                    <div className="w-full md:w-1/2 bg-gray-100 max-h-[50vh] md:max-h-[90vh] overflow-y-auto custom-scrollbar flex items-center justify-center">
                      <img src={expandedRecipe.image} alt={expandedRecipe.title} className="w-full h-auto object-contain min-h-full" />
                    </div>
                    <div className="w-full md:w-1/2 p-8 md:p-12 overflow-y-auto flex flex-col justify-center items-center text-center">
                       <div className="inline-block bg-[#EAEFE9] text-[#4A5D4E] px-4 py-1.5 rounded-full text-sm font-medium mb-6">{expandedRecipe.category}</div>
                      <h2 className="text-3xl md:text-4xl font-serif text-gray-800 mb-6">{expandedRecipe.title}</h2>
                      <button onClick={() => setExpandedRecipe(null)} className="px-8 py-3 border-2 border-[#D18E84] text-[#D18E84] hover:bg-[#D18E84] hover:text-white rounded-full font-medium transition-colors">חזרה לספר</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Modal for Adding Recipe */}
              {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={closeModal}>
                  <div className="bg-white rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-center p-6 border-b border-gray-100 bg-gray-50/50">
                      <h2 className="text-2xl font-serif text-[#4A5D4E]">הוספת מתכון חדש</h2>
                      <button onClick={closeModal} className="text-gray-400 hover:text-gray-700 bg-white p-2 rounded-full shadow-sm">✕</button>
                    </div>

                    <div className="p-6 md:p-8 space-y-6">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">שם המתכון</label>
                        <input type="text" value={newRecipeTitle} onChange={(e) => setNewRecipeTitle(e.target.value)} placeholder="למשל: עוגת השוקולד של אמא" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none" />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">קטגוריה</label>
                        <select value={newRecipeCategory} onChange={(e) => setNewRecipeCategory(e.target.value)} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none">
                          {CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                        </select>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">תמונת המתכון (סריקה / צילום)</label>
                        {!newRecipeImage ? (
                          <div className="mt-1 flex justify-center px-6 pt-8 pb-10 border-2 border-gray-300 border-dashed rounded-2xl hover:border-[#738C7A] hover:bg-gray-50 transition-colors relative">
                            <div className="space-y-3 text-center">
                              <div className="text-sm text-gray-600">
                                <label htmlFor="file-upload" className="cursor-pointer font-medium text-[#738C7A]">
                                  <span>לחצו להעלאת קובץ</span>
                                  <input id="file-upload" type="file" accept="image/*" className="sr-only" onChange={handleFileUpload} />
                                </label>
                                <p className="mt-2 text-gray-500">או עשו <kbd className="bg-gray-100 px-2 py-1 rounded text-xs">Ctrl + V</kbd> להדבקה</p>
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div className="relative rounded-2xl overflow-hidden border border-gray-200">
                            <img src={newRecipeImage} alt="Preview" className="w-full h-64 object-cover" />
                            <button onClick={() => setNewRecipeImage(null)} className="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full text-xs">הסר</button>
                          </div>
                        )}
                      </div>

                      {errorMsg && <div className="p-3 bg-red-[#FEF2F2] text-red-600 rounded-xl text-sm">{errorMsg}</div>}

                      <div className="pt-4 flex gap-3">
                        <button onClick={saveRecipe} disabled={isSaving} className="flex-1 bg-[#738C7A] text-white py-3 px-4 rounded-xl font-medium">
                          {isSaving ? 'שומר...' : 'שמירת המתכון בספר'}
                        </button>
                        <button onClick={closeModal} className="flex-1 bg-gray-100 text-gray-700 py-3 px-4 rounded-xl font-medium">ביטול</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              <footer className="mt-20 py-8 text-center text-gray-400 text-sm border-t border-gray-100">
                <p>ספר המתכונים המשפחתי • נוצר באהבה</p>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
